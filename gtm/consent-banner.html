<script>
/* Баннер согласия на cookie и Consent Mode v2 (базовый режим). Код вставляется в GTM-MVHPCXM3
   вручную: тег «Пользовательский HTML», триггер Consent Initialization - All Pages.
   Согласие по умолчанию (denied) и восстановление сохранённого выбора — в <head> сайта до GTM
   (scripts/consent.mjs): из этого тега они срабатывали бы позже тегов. KEY и POLICY — те же.
   Страховка: если страница пришла без скрипта из <head> (старый HTML из кэша), default ставит этот тег.
   Баннер не перекрывает кнопки связи первого экрана: стоит в пустом нижнем отступе первого блока
   (#top, pb-[150px]), уезжает при прокрутке; на страницах без #top — в потоке над шапкой.
   Текст обрезан до 2 строк, «Подробнее» или клик по тексту раскрывает его полностью.
   Теги Google и Meta требуют ad_storage/analytics_storage и до согласия не срабатывают. По клику «Принять» уходит событие consent_update — по нему
   срабатывают теги страницы (PageView, теги Google); у этих тегов «Один раз на странице».
   Выбор хранится в localStorage с датой и версией политики; ссылка [data-cookie-settings]
   в подвале открывает баннер снова. Тексты утверждены юристом 27.10.2026. */
(function () {
var KEY = "janastart_consent";
var POLICY = "2026-10-27";
var TTL = 365 * 24 * 60 * 60 * 1000;
var TYPES = ["ad_storage", "ad_user_data", "ad_personalization", "analytics_storage"];
var KK = document.documentElement.lang === "kk";
var T = KK ? {
text: "Сайттың қалай жұмыс істейтінін түсіну және сайтқа кірген адамдарға жарнама көрсету үшін біз cookie файлдарын, Google Analytics және Meta мен Google жарнама құралдарын пайдаланамыз. Бұл деректер шетелге беріледі. Толығырақ — ",
link: "Құпиялылық саясатында", href: "/kz/politika/", more: "Толығырақ", accept: "Қабылдау", reject: "Бас тарту"
} : {
text: "Мы используем файлы cookie, Google Analytics и рекламные инструменты Meta и Google, чтобы понимать, как работает сайт, и показывать рекламу тем, кто на нём был. Эти данные передаются за рубеж. Подробнее — в ",
link: "Политике конфиденциальности", href: "/politika/", more: "Подробнее", accept: "Принять", reject: "Отклонить"
};
window.dataLayer = window.dataLayer || [];
function gtag() { window.dataLayer.push(arguments); }
function state(v) { var s = {}; for (var i = 0; i < TYPES.length; i++) s[TYPES[i]] = v; return s; }
function read() {
try {
var c = JSON.parse(localStorage.getItem(KEY));
if (c && c.policy === POLICY && Date.now() - c.date < TTL) return c;
} catch (e) {}
return null;
}
function hasDefault() {
var dl = window.dataLayer;
for (var i = 0; i < dl.length; i++) if (dl[i] && dl[i][0] === "consent" && dl[i][1] === "default") return true;
return false;
}
function save(choice) {
try { localStorage.setItem(KEY, JSON.stringify({ choice: choice, date: Date.now(), policy: POLICY })); } catch (e) {}
}
function apply(choice) { gtag("consent", "update", state(choice)); }
var box = null;
var collapsedH = 0;
// В нижний отступ #top (шапка z-40 и панель z-30 — поверх баннера при прокрутке); без #top — в начало body.
function place() {
if (!box) return;
var hero = document.getElementById("top");
if (!hero) { if (box.parentNode !== document.body || box !== document.body.firstChild) document.body.insertBefore(box, document.body.firstChild); return; }
if (box.parentNode !== document.body) document.body.appendChild(box);
box.style.position = "absolute";
box.style.left = "0";
box.style.right = "0";
box.style.zIndex = "20";
box.style.top = Math.round(hero.getBoundingClientRect().bottom + window.scrollY - collapsedH) + "px";
}
function hide() { if (box) { box.remove(); box = null; window.removeEventListener("resize", place); window.removeEventListener("load", place); } }
function button(label, choice) {
var b = document.createElement("button");
b.type = "button";
b.textContent = label;
b.style.cssText = "flex:none;padding:7px 14px;border-radius:6px;border:1px solid #f2b84b;background:#141a33;color:#fff;font:600 14px/1.2 system-ui,sans-serif;cursor:pointer";
b.onclick = function () {
save(choice);
apply(choice);
if (choice === "granted") window.dataLayer.push({ event: "consent_update" });
hide();
};
return b;
}
function show() {
if (box) return;
if (!document.body) { document.addEventListener("DOMContentLoaded", show); return; }
box = document.createElement("div");
box.setAttribute("role", "dialog");
box.setAttribute("aria-label", "Cookie");
var mobile = window.innerWidth < 768;
box.style.cssText = "display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px max(12px,env(safe-area-inset-left));background:#141a33;color:#d6dbee;border-top:1px solid #2a3150;border-bottom:1px solid #2a3150;font:" + (mobile ? 12 : 14) + "px/1.35 system-ui,sans-serif";
var p = document.createElement("p");
var CLAMP = "display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;";
p.style.cssText = CLAMP + "flex:1 1 280px;margin:0;cursor:pointer";
p.appendChild(document.createTextNode(T.text));
var a = document.createElement("a");
a.href = T.href;
a.textContent = T.link;
a.style.cssText = "color:#fff;text-decoration:underline";
p.appendChild(a);
p.appendChild(document.createTextNode("."));
var row = document.createElement("div");
row.style.cssText = "display:flex;align-items:center;gap:8px;margin-left:auto";
var more = document.createElement("button");
more.type = "button";
more.textContent = T.more;
more.style.cssText = "flex:none;padding:7px 4px;border:0;background:none;color:#fff;font:inherit;text-decoration:underline;cursor:pointer";
function expand() { p.style.cssText = "flex:1 1 280px;margin:0"; more.remove(); }
more.onclick = expand;
p.onclick = expand;
row.appendChild(more);
row.appendChild(button(T.accept, "granted"));
row.appendChild(button(T.reject, "denied"));
box.appendChild(p);
box.appendChild(row);
document.body.appendChild(box);
if (p.scrollHeight <= p.clientHeight) expand();
collapsedH = box.offsetHeight;
place();
window.addEventListener("resize", place);
window.addEventListener("load", place);
}
var stored = read();
if (!hasDefault()) {
gtag("consent", "default", state("denied"));
if (stored && stored.choice === "granted") apply("granted");
}
if (!stored) show();
document.addEventListener("click", function (e) {
if (e.target.closest && e.target.closest("[data-cookie-settings]")) { show(); if (box) box.scrollIntoView({ block: "center" }); }
});
})();
</script>
